[workspace]
resolver = "2"
members = [
    "crates/sentry-core",
    "crates/sentry-hardware",
    "crates/sentry-telepresence",
    "crates/sentry-bridge",
    "crates/sentry-ledger",
    "crates/sentry-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rick <xuoxod>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/xuoxod/sentry-edge"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
clap = { version = "4.4", features = ["derive", "cargo", "env"] }
colored = "2.1"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.23"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
bytes = "1.6"
async-trait = "0.1"
subtle = "2.5"
sysinfo = "0.30"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
toml = "0.8"
tempfile = "3.10"
